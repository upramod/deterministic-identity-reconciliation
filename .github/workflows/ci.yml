name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: identity_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity_test -d identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTITY_TEST_DATABASE_URL: postgres://identity_test:local_test_only@localhost:5432/identity_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test PostgreSQL persistence and competing writers
        run: go test -race ./pkg/store/postgres -run TestPostgres -count=1 -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/scim-interop-requirements.txt
      - name: Install independent SCIM server
        run: python -m pip install -r scripts/scim-interop-requirements.txt
      - name: Test fresh-process persisted convergence end to end
        run: python scripts/test-scim-interop.py --end-to-end

  scim-interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/scim-interop-requirements.txt
      - name: Install independent server and pinned dependencies
        run: python -m pip install -r scripts/scim-interop-requirements.txt
      - name: Test lifecycle, response loss, and conditional writes
        run: python scripts/test-scim-interop.py
